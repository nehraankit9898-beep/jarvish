[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentscope"
version = "2.0.10"
description = "AgentScope: Agent-Oriented Programming for building LLM applications (bundled source for AgentScope Studio)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.6",
  "typing-extensions>=4.5",
  "openai>=1.40",
  "anthropic>=0.34",
  "google-genai>=1.0",
  "httpx>=0.27",
  "websockets>=12",
  "aiofiles>=24.1",
  "rich>=13.7",
  "PyYAML>=6.0",
  "jsonschema>=4.21",
  "requests>=2.31",
  "mcp>=1.0",
  "Jinja2>=3.1",
  "docstring-parser>=0.16",
  "tree-sitter>=0.23",
  "tree-sitter-bash>=0.23",
  "python-frontmatter>=1.1",
  "numpy>=1.26",
]

[project.optional-dependencies]
dashscope = ["dashscope"]
k8s = ["kubernetes-asyncio"]
sandboxes = ["e2b", "daytona"]
social = ["discord.py", "lark-oapi"]
memory = ["mem0ai"]
a2a = ["a2a-sdk"]
tracing = ["opentelemetry-api", "opentelemetry-sdk"]
vector = ["qdrant-client", "pymongo"]
server = ["fastapi", "uvicorn", "sqlalchemy", "alembic", "apscheduler", "redis"]
tui = ["textual"]
rag = ["pandas", "numpy", "python-docx", "python-pptx", "openpyxl"]

[tool.setuptools.packages.find]
include = ["agentscope*"]
